# Serves the static frontend and proxies /api/* to FastAPI (same origin: no CORS needed).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Defence in depth: the app never uses innerHTML, and this CSP forbids inline scripts
    # and limits images to MyAnimeList's CDN.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://cdn.myanimelist.net; connect-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s; # explanations can take a few seconds
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache" always; # dev-friendly; fingerprint files for prod
    }
}
