# Default: api + ui, talking to the Qdrant cluster configured in .env (QDRANT_URL / QDRANT_API_KEY).
# Offline dev with a local Qdrant:   docker compose --profile local-qdrant up
#   (and set QDRANT_URL=http://qdrant:6333 in .env)

x-app: &app
  build:
    context: .
    target: runtime
  image: anime-rec:latest
  env_file: .env
  volumes:
    - ./data:/app/data # raw CSV in, parquet + embedding cache out (persist across runs)

services:
  api:
    <<: *app
    command: ["anime-rec", "serve", "--port", "8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  ui:
    <<: *app
    command: ["anime-rec", "ui", "--port", "8501"]
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Pipeline stages and dev tooling:  docker compose run --rm dev <command>
  dev:
    build:
      context: .
      target: dev
    image: anime-rec:dev
    env_file: .env
    volumes:
      - .:/app # live source; the venv lives in /opt/venv inside the image
    profiles: ["dev"]

  qdrant:
    image: qdrant/qdrant:v1.15.0
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_storage:/qdrant/storage
    profiles: ["local-qdrant"]
    restart: unless-stopped

volumes:
  qdrant_storage:
