# Default: api + ui, talking to the Qdrant cluster configured in .env (QDRANT_URL / QDRANT_API_KEY).
# Offline dev with a local Qdrant:   docker compose --profile local-qdrant up
#   (and set QDRANT_URL=http://qdrant:6333 in .env)

x-app: &app
  build:
    context: .
    target: runtime
    args:
      TORCH_VARIANT: cpu # serving embeds one short query at a time: CPU is plenty
  # No shared `image:` tag: api and ui build in parallel and would race on it.
  # They still share every layer via the BuildKit cache.
  env_file: .env
  volumes:
    - ./data:/app/data # raw CSV in, parquet + embedding cache out (persist across runs)

services:
  api:
    <<: *app
    command: ["anime-rec", "serve", "--port", "8000"]
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 120s # model load + catalog scan happen before the port opens
    restart: unless-stopped

  ui:
    <<: *app
    command: ["anime-rec", "ui", "--port", "8501"]
    ports: ["8501:8501"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Batch stages:  docker compose run --rm pipeline anime-rec <ingest|embed|index|eval>
  # On the GPU:     add -f docker-compose.gpu.yml   (Makefile: make embed GPU=1)
  pipeline:
    <<: *app
    command: ["anime-rec", "--help"]
    volumes:
      - ./data:/app/data
      - ./eval:/app/eval:ro # evaluation query set
    profiles: ["pipeline"]

  # Tests, lint, type checks:  docker compose run --rm dev <command>
  dev:
    build:
      context: .
      target: dev
    image: anime-rec:dev
    env_file: .env
    # Run as the host user so files written to the bind mount (uv.lock, caches) aren't root-owned.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      UV_CACHE_DIR: /tmp/uv-cache
      HOME: /tmp
    volumes:
      - .:/app # live source; the venv lives in /opt/venv inside the image
    profiles: ["dev"]

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_storage:/qdrant/storage
    profiles: ["local-qdrant"]
    restart: unless-stopped

volumes:
  qdrant_storage:
