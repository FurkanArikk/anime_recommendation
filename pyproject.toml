[project]
name = "anime-rec"
version = "0.1.0"
description = "End-to-end anime recommendation system: Gemini embeddings + Qdrant + FastAPI + Streamlit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # data
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pandera>=0.22",
    # config / validation / logging
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    # embeddings + LLM
    "google-genai>=1.0",
    "tenacity>=9.0",
    # vector store
    "qdrant-client>=1.12",
    # serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "streamlit>=1.40",
    # evaluation query set
    "pyyaml>=6.0",
]

[project.scripts]
anime-rec = "anime_rec.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_rec"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
