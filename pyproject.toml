[project]
name = "anime-rec"
version = "0.1.0"
description = "End-to-end anime recommendation system: open embeddings + Qdrant + FastAPI + Gemini, with a chat web UI"
readme = "README.md"
license = "MIT"
authors = [{ name = "FurkanArikk", email = "fuaarik@gmail.com" }]
keywords = ["recommender-system", "rag", "vector-search", "qdrant", "embeddings", "gemini", "anime"]
requires-python = ">=3.11"
dependencies = [
    # data
    "pandas>=3.0,<4",  # 3.x: missing strings are NaN, not None (handled in to_payload)
    "pyarrow>=17.0",
    "pandera>=0.24",
    # config / validation / logging
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    # embeddings + LLM
    "sentence-transformers>=6.0",
    "google-genai>=1.0",
    "tenacity>=9.0",
    # vector store
    "qdrant-client>=1.12",
    # serving
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # evaluation query set
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Exactly one of these must be installed (the Dockerfile picks via TORCH_VARIANT).
# PyPI's default Linux torch wheel bundles CUDA (~GBs); these pull from PyTorch's indexes.
cpu = ["torch>=2.8"]
gpu = ["torch>=2.8"]

[project.scripts]
anime-rec = "anime_rec.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"  # CUDA 13.0: needs NVIDIA driver >= 580; RTX 30xx+ supported
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/anime_rec"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Expected: tests use in-memory Qdrant, which ignores payload indexes.
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
