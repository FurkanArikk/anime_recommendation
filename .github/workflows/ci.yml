name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    env:
      # `uv run` would otherwise re-sync without the cpu extra and pull CUDA torch (GBs).
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install (locked, CPU-only torch)
        run: uv sync --frozen --extra cpu

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src

      - name: Pytest (no network, no GPU, no API keys)
        run: uv run pytest --cov=anime_rec --cov-report=term-missing:skip-covered

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4

      - name: API / pipeline image (runtime target)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
